name: Refresh profile assets

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/**
      - tests/**
      - .github/workflows/profile-assets.yml

permissions:
  contents: read

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'emilwojcik93/emilwojcik93'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0

      - name: Test public-data aggregation and failure handling
        run: python3 -m unittest discover -s tests -v

      - name: Generate public statistics
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile_stats.py

      - name: Generate contribution animation
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: emilwojcik93
          outputs: assets/snake.svg?palette=github-dark

      - name: Commit changed assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/top-languages.svg assets/snake.svg
          if git diff --cached --quiet; then
            echo 'Profile assets are already current.'
            exit 0
          fi
          git commit -m 'chore: refresh public profile assets'
          git pull --rebase origin main
          git push origin HEAD:main
